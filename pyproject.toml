[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-dc-agent"
version = "1.1.0"
description = "AI agent for Jira Data Center: issues and Insight/Assets by project"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jira DC Agent" }]
dependencies = [
    "httpx>=0.27.0,<0.29",
    "python-dotenv>=1.0.1,<2",
    "typer>=0.12.3,<0.16",
    "click>=8.1.7,<8.2",
    "rich>=13.7.0,<14",
    "tenacity>=8.3.0,<10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9",
    "pytest-asyncio>=0.23.0,<0.25",
    "respx>=0.22.0,<0.23",
]

[project.scripts]
jira-agent = "jira_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
